# Define o nome do workflow de Integração Contínua que será exibido no GitHub Actions
name: Continuous Integration

# Define os eventos que disparam a execução deste workflow
on:
  # Dispara o workflow em eventos de push (envio de código)
  push:
    # Filtra os disparos apenas para commits feitos nas branches main, master ou develop
    branches: [ main, master, develop ]
  # Dispara o workflow em eventos de pull request (solicitação de mesclagem)
  pull_request:
    # Filtra para pull requests que tenham como destino as branches main, master ou develop
    branches: [ main, master, develop ]

# Define a lista de jobs (trabalhos) independentes ou dependentes que serão executados
jobs:
  # Primeiro job: executa linting e checagem de estilo de código Python
  lint:
    # Nome amigável que aparece na interface do GitHub para este job
    name: Lint & Style Checks
    # Especifica o sistema operacional da máquina virtual do runner (Ubuntu mais recente)
    runs-on: ubuntu-latest
    # Define a sequência de passos que o job lint executará
    steps:
      # Passo 1: Faz o checkout (download) do código do repositório para a máquina virtual
      - name: Checkout Code
        # Utiliza a action padrão oficial do GitHub para fazer o checkout do código
        uses: actions/checkout@v4

      # Passo 2: Configura o interpretador Python na máquina virtual
      - name: Set up Python
        # Utiliza a action oficial para instalar/configurar o ambiente Python
        uses: actions/setup-python@v5
        # Define os parâmetros de entrada para a action do Python
        with:
          # Especifica a versão do Python a ser instalada (3.12)
          python-version: '3.12'

      # Passo 3: Executa o Ruff Linter para validar a qualidade do código Python
      - name: Run Ruff Linter
        # Utiliza a action oficial do criador do Ruff para fazer a verificação
        uses: astral-sh/ruff-action@v3
        # Define os parâmetros de entrada para o Ruff
        with:
          # Executa o Ruff check nos diretórios do Airflow e do dbt
          args: check airflow dbt

  # Segundo job: executa o teste de integração completo dos containers, Airflow, dbt e Postgres
  integration-test:
    # Nome amigável exibido na interface do GitHub para o teste de integração
    name: Integration Test (Docker + Airflow + dbt + Postgres)
    # Roda o job em uma máquina virtual Linux Ubuntu
    runs-on: ubuntu-latest
    needs: lint

    # Define a sequência de passos para o job de teste de integração
    steps:
      # Passo 1: Faz o checkout do código do repositório na máquina virtual
      - name: Checkout Code
        # Utiliza a action padrão oficial de checkout
        uses: actions/checkout@v4

      # Passo 2: Cria o arquivo .env contendo as variáveis de ambiente necessárias
      - name: Create Test .env File
        # Executa comandos bash para gerar o arquivo .env
        run: |
          # Utiliza 'cat' com heredoc para escrever múltiplas linhas no arquivo .env
          cat <<EOF > .env
          # Variável para o usuário do banco de dados Postgres do dbt (vinda dos Secrets do GitHub)
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          # Variável para a senha do banco de dados Postgres do dbt (vinda dos Secrets do GitHub)
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          # Variável para o nome do banco de dados Postgres do dbt (vinda dos Secrets do GitHub)
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          # Variável para o hostname do Postgres do dbt (vinda dos Secrets do GitHub)
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          # Variável para a porta do Postgres do dbt (vinda dos Secrets do GitHub)
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          
          # Configura o tipo de executor do Airflow (vinda dos Secrets do GitHub)
          AIRFLOW__CORE__EXECUTOR=${{ secrets.AIRFLOW__CORE__EXECUTOR }}
          # Configura a chave secreta JWT para autenticação na API do Airflow 3 (corrige chave de fechamento)
          AIRFLOW__API_AUTH__JWT_SECRET=${{ secrets.AIRFLOW__API_AUTH__JWT_SECRET }}
          # Configura a string de conexão SQLAlchemy para o banco de metadados do Airflow
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${{ secrets.AIRFLOW__DATABASE__SQL_ALCHEMY_CONN }}
          # Define a senha padrão do usuário administrador inicial do Airflow
          AIRFLOW_ADMIN_PASSWORD=${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
          
          # Variável para o usuário do banco de dados Postgres de metadados do Airflow
          AIRFLOW_POSTGRES_USER=${{ secrets.AIRFLOW_POSTGRES_USER }}
          # Variável para a senha do banco de dados Postgres de metadados do Airflow
          AIRFLOW_POSTGRES_PASSWORD=${{ secrets.AIRFLOW_POSTGRES_PASSWORD }}
          # Variável para o nome do banco de dados Postgres de metadados do Airflow
          AIRFLOW_POSTGRES_DB=${{ secrets.AIRFLOW_POSTGRES_DB }}
          # Variável para o host do Postgres de metadados do Airflow
          AIRFLOW_POSTGRES_HOST=${{ secrets.AIRFLOW_POSTGRES_HOST }}
          # Variável para a porta do Postgres de metadados do Airflow
          AIRFLOW_POSTGRES_PORT=${{ secrets.AIRFLOW_POSTGRES_PORT }}
          
          # Configura o diretório local do container onde estão localizados os profiles.yml do dbt
          DBT_PROFILES_DIR=${{ secrets.DBT_PROFILES_DIR }}
          # Fim do bloco de escrita do arquivo .env
          EOF

      # Passo 3: Configura o Docker Buildx na máquina virtual para otimização de build
      - name: Set up Docker Buildx
        # Utiliza a action oficial para configurar o Buildx (permite build multi-plataforma e cache)
        uses: docker/setup-buildx-action@v3

      # Passo 4: Constrói as imagens locais e inicia os containers da stack em segundo plano
      - name: Build and Start Services
        # Roda o comando do docker compose buildando e subindo os serviços em background (-d)
        run: docker compose up --build -d --wait

      # Passo 5: Loop de espera para garantir que o banco Postgres subiu e aceita conexões
      - name: Wait for Postgres to be healthy
        # Executa comandos bash para testar ciclicamente a saúde do Postgres
        run: |
          # Imprime uma mensagem informativa indicando o início da espera
          echo "Aguardando o Postgres iniciar..."
          # Faz um loop de 1 até 30 tentativas de conexão
          for i in {1..30}; do
            # Executa pg_isready dentro do container postgres_airflow usando as credenciais definidas
            if docker compose exec -T postgres_airflow pg_isready -U ${{ secrets.AIRFLOW_POSTGRES_USER }} -d ${{ secrets.AIRFLOW_POSTGRES_DB }}; then
              # Se o banco estiver pronto, exibe mensagem e sai do loop
              echo "Postgres está pronto!"
              break
            fi
            # Se não estiver pronto, imprime aguardando e dorme por 2 segundos antes da próxima tentativa
            echo "Aguardando..."
            sleep 2
          done

      - name: Check Container Status
        run: docker compose ps -a

      - name: Check Airflow container
        run: docker compose exec -T airflow-api-server airflow version

      # Passo 7: Exibe a lista e o estado atual de todos os containers ativos no runner do CI
      - name: Check Container Status
        # Executa o docker compose ps para auditoria/debugging em caso de falhas
        run: docker compose ps

      # Passo 8: Executa o comando dbt debug para validar conexões e perfis de banco
      - name: Run dbt debug (Test connection to Postgres)
        # Executa sem alocação de TTY (-T) o comando dbt debug no container do dbt
        run: docker compose exec -T dbt dbt debug

      # Passo 9: Executa os modelos do dbt compilando e rodando-os no banco de dados do CI
      - name: Run dbt run (Execute Northwind models)
        # Executa dbt run no container dbt para materializar os schemas e tabelas
        run: docker compose exec -T dbt dbt run

      # Passo 10: Executa os testes de dados do dbt para assegurar a consistência dos modelos
      - name: Run dbt test (Execute data tests)
        # Executa dbt test no container dbt validando as restrições declaradas
        run: docker compose exec -T dbt dbt test

      # Passo 11: Remove todos os containers, redes e volumes criados durante a execução do CI
      - name: Shut down services
        # Condicional que garante que este passo rodará sempre (mesmo se passos anteriores falharem)
        if: always()
        # Executa o docker compose down deletando também os volumes (-v) para liberar recursos
        run: docker compose down -v
