name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint & Style Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: check airflow dbt

  integration-test:
    name: Integration Test (Docker + Airflow + dbt + Postgres)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

            - name: Create Test .env File
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}

          AIRFLOW__CORE__EXECUTOR=${{ secrets.AIRFLOW__CORE__EXECUTOR }}
          AIRFLOW__API_AUTH__JWT_SECRET=${{ secrets.AIRFLOW__API_AUTH__JWT_SECRET }}
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${{ secrets.AIRFLOW__DATABASE__SQL_ALCHEMY_CONN }}
          AIRFLOW_ADMIN_PASSWORD=${{ secrets.AIRFLOW_ADMIN_PASSWORD }}

          AIRFLOW_POSTGRES_USER=${{ secrets.AIRFLOW_POSTGRES_USER }}
          AIRFLOW_POSTGRES_PASSWORD=${{ secrets.AIRFLOW_POSTGRES_PASSWORD }}
          AIRFLOW_POSTGRES_DB=${{ secrets.AIRFLOW_POSTGRES_DB }}
          AIRFLOW_POSTGRES_HOST=${{ secrets.AIRFLOW_POSTGRES_HOST }}
          AIRFLOW_POSTGRES_PORT=${{ secrets.AIRFLOW_POSTGRES_PORT }}

          DBT_PROFILES_DIR=${{ secrets.DBT_PROFILES_DIR }}
          EOF

      - name: Validate generated .env
        run: |
          grep '^POSTGRES_HOST=' .env
          grep '^POSTGRES_PORT=' .env
          grep '^DBT_PROFILES_DIR=' .env

      - name: Check POSTGRES_HOST inside dbt container
        run: docker compose exec -T dbt sh -lc 'printf "POSTGRES_HOST=%s\n" "$POSTGRES_HOST"'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Services
        run: docker compose up --build -d --wait

      - name: Wait for Postgres to be healthy
        run: |
          echo "Aguardando o Postgres iniciar..."
          for i in {1..30}; do
            if docker compose exec -T postgres_airflow pg_isready -U ${{ secrets.AIRFLOW_POSTGRES_USER }} -d ${{ secrets.AIRFLOW_POSTGRES_DB }}; then
              echo "Postgres está pronto!"
              break
            fi
            echo "Aguardando..."
            sleep 2
          done

      - name: Check Container Status
        run: docker compose ps -a

      - name: Check POSTGRES_HOST inside dbt container
        run: docker compose exec -T dbt sh -lc 'echo "$POSTGRES_HOST"'

