meu_projeto_dbt:
  outputs:
    dev:
      dbname: '{{ env_var(''POSTGRES_DB'') }}'
      host: '{{ env_var(''POSTGRES_HOST'') }}'
      password: '{{ env_var(''POSTGRES_PASSWORD'') }}'
      port: '{{ env_var(''POSTGRES_PORT'') }}'
      schema: public
      threads: 4
      type: postgres
      user: '{{ env_var(''POSTGRES_USER'') }}'
    prod:
      dbname: '{{ env_var(''POSTGRES_DB'') }}'
      host: '{{ env_var(''POSTGRES_HOST'') }}'
      password: '{{ env_var(''POSTGRES_PASSWORD'') }}'
      port: '{{ env_var(''POSTGRES_PORT'') }}'
      schema: public
      threads: 4
      type: postgres
      user: '{{ env_var(''POSTGRES_USER'') }}'
  target: projeto_airflow_dbt

projeto_northwind:
  outputs:
    dev:
      dbname: '{{ env_var(''POSTGRES_DB'') }}'
      host: '{{ env_var(''POSTGRES_HOST'') }}'
      password: '{{ env_var(''POSTGRES_PASSWORD'') }}'
      port: 5432
      schema: public
      threads: 4
      type: postgres
      user: '{{ env_var(''POSTGRES_USER'') }}'
  target: dev
